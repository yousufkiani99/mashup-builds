# BUILD: Mojave in Skyrim 0.2.0 -> DRAFT release mojave-in-skyrim-v0.2.0 of this repo.
# Mojave in Skyrim by Pitorad (Skyrim SE/AE plugin that plays the player's own Fallout: New Vegas music,
# GPL-3.0-or-later), built unchanged at a pinned commit with its submodules (CommonLibSSE-NG 94faaed, miniaudio
# 9634bed) and its vcpkg manifest (builtin-baseline ee12231), using the repo's CMake presets.
# src/generated/Sheets.h and package/MojaveInSkyrim.ini are committed, generated files. They are touched before the
# build so CMake never re-runs tools/sheets.py gen (which reads game files that are not here and must never be);
# the job fails if they change. Address Library bins (meh321) are NOT packaged. No game files.
#
# Two jobs: `build` runs the creator's build on a Windows runner with a read-only token and uploads the files
# as an artifact; `release` runs none of that code: it checks SHA256SUMS.txt, LICENSE/NOTICE, the GPL source
# and that no game file is in any file or archive, then makes a DRAFT release (published by hand after review).
# Started by hand: gh api -X POST repos/yousufkiani99/mashup-builds/actions/workflows/build-mojave-in-skyrim.yml/dispatches
# -f ref=<branch>. The push trigger only registers the workflow; on a push both jobs are skipped.
name: Build - Mojave in Skyrim

on:
  push:
    branches: ['builds/wave2']
    paths: ['.github/workflows/build-mojave-in-skyrim.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022   # VS 2022, as the creator's MODLOG.md
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      ID: mojave-in-skyrim
      VER: 0.2.0
      UPSTREAM: Pitorad/mojave-in-skyrim
      UPSTREAM_SHA: 58520efa9e7905421065ba866a7df4968dc36e43
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Pitorad/mojave-in-skyrim
          ref: 58520efa9e7905421065ba866a7df4968dc36e43
          path: upstream
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Logs folder
        shell: bash
        working-directory: .
        run: |
          mkdir -p logs out
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"   # the pinned commit, nothing else
          git -C upstream log -1 --format='upstream %H %ci %s' | tee logs/0-upstream.txt

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get vcpkg at the manifest's baseline, where the preset looks (../.tools/vcpkg)
        id: vcpkg
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git clone -q https://github.com/microsoft/vcpkg .tools/vcpkg
          git -C .tools/vcpkg checkout -q ee12231b20c95013c6638d845d04c91559a1d1ff
          cmd //c ".tools\\vcpkg\\bootstrap-vcpkg.bat -disableMetrics" | tee logs/0-vcpkg.log
          mkdir -p vcpkg-downloads

      - name: Build MojaveInSkyrim.asi (cmake --preset default; cmake --build --preset release)
        id: native
        shell: bash
        env:
          VCPKG_DOWNLOADS: ${{ github.workspace }}\vcpkg-downloads
          VCPKG_ROOT: ${{ github.workspace }}\.tools\vcpkg
        run: |
          set -o pipefail
          touch src/generated/Sheets.h package/MojaveInSkyrim.ini
          { cl 2>&1 | head -1; cmake --version | head -1; ninja --version; } | tee ../logs/1-native.log
          cmake --preset default 2>&1 | tee -a ../logs/1-native.log
          python -I - build >> ../logs/1-native.log 2>&1 <<'EOF'
          import pathlib, sys
          n = 0
          for p in pathlib.Path(sys.argv[1]).rglob('*.ninja'):
              lines = p.read_text(encoding='utf-8').split('\n'); hit = False
              for i, l in enumerate(lines):
                  if l.lstrip().startswith('COMMAND = ') and 'tools/sheets.py gen' in l:
                      lines[i] = l[:l.index('COMMAND = ')] + 'COMMAND = cmd.exe /C echo sheets.py gen skipped: using the committed src/generated/Sheets.h and package/MojaveInSkyrim.ini'
                      print('no-op for sheets.py gen in', p, ':', l.strip()); n += 1; hit = True
              if hit: p.write_text('\n'.join(lines), encoding='utf-8')
          sys.exit(0 if n else 'sheets.py gen not found in the build files')
          EOF
          cmake --build --preset release 2>&1 | tee -a ../logs/1-native.log
          test -f build/RelWithDebInfo/MojaveInSkyrim.asi
          git status --porcelain --untracked-files=no | tee -a ../logs/1-native.log
          git diff --quiet -- src/generated/Sheets.h package/MojaveInSkyrim.ini || { echo "generated files changed"; exit 1; }
          ls build/vcpkg_installed/*/share 2>/dev/null | tee ../logs/1-vcpkg-installed.txt || true
          find build/vcpkg_installed -name 'vcpkg_abi_info.txt' -o -name '*.list' 2>/dev/null | head -50 >> ../logs/1-vcpkg-installed.txt || true

      - name: Package the release files and the source
        id: package
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$(cygpath -u "$GITHUB_WORKSPACE")/logs/3-package-trace.log") 2>&1   # readable in the failure-log draft
          trap 'echo "FAILED (exit $?) at line $LINENO: $BASH_COMMAND"' ERR
          OUT=../out; ST=../stage; rm -rf "$ST"; mkdir -p "$ST/game/Data/SKSE/Plugins/MojaveInSkyrim" "$ST/src"
          cp LICENSE "$OUT/LICENSE.txt"
          {
            echo "Mojave in Skyrim ${VER} - unofficial community build"
            echo
            echo "What this is: a ready-made build of Mojave in Skyrim (\"Courier 6 went down to Skyrim\") by Pitorad,"
            echo "https://github.com/${UPSTREAM}, compiled unchanged from commit ${UPSTREAM_SHA} (submodules"
            echo "CommonLibSSE-NG 94faaed0c60eddd8347767f2d4d29a97c93bde8c, miniaudio 9634bedb5b5a2ca38c1ee7108a9358a4e233f14d;"
            echo "vcpkg baseline ee12231b20c95013c6638d845d04c91559a1d1ff) by GitHub Actions (windows-latest, the repo's CMake"
            echo "presets with MSVC, RelWithDebInfo). It is NOT an official release: it is a community build made for the"
            echo "Mashup Library app under the GNU GPL v3 or later (LICENSE.txt). The complete source used for this build is"
            echo "${ID}-${VER}-source.zip, published next to it. Report problems with this build to the Mashup Library, not"
            echo "to Pitorad."
            echo
            echo "Single player. Loaded by Ultimate ASI Loader (installed separately); needs Address Library for SKSE Plugins"
            echo "(meh321, installed separately, not included). Plays music from your own Fallout: New Vegas."
            echo
            echo "NOT affiliated with Bethesda. No game files are included."
            echo
            echo "---- Files ----"
            echo "${ID}-${VER}.zip unpacks into the Skyrim Special Edition folder: MojaveInSkyrim.asi, MojaveInSkyrim.ini,"
            echo "  Data/SKSE/Plugins/MojaveInSkyrim/ (README.md, LICENSE.txt, THIRD-PARTY-NOTICES.md, NOTICE.txt)"
            echo "${ID}-${VER}-source.zip: the repo with its submodules at the pinned commits, vcpkg.json, and the source"
            echo "  archives vcpkg downloaded for the libraries linked in (vcpkg-downloads/)"
            echo
            echo "==== THIRD-PARTY-NOTICES.md ===="; cat THIRD-PARTY-NOTICES.md; echo
          } > "$OUT/NOTICE.txt"
          cp build/RelWithDebInfo/MojaveInSkyrim.asi package/MojaveInSkyrim.ini "$ST/game/"
          D="$ST/game/Data/SKSE/Plugins/MojaveInSkyrim"
          cp README.md "$D/"; cp LICENSE "$D/LICENSE.txt"; cp THIRD-PARTY-NOTICES.md "$D/"; cp "$OUT/NOTICE.txt" "$D/"
          (cd "$ST/game" && 7z a -tzip -bso0 "../../out/${ID}-${VER}.zip" .)
          # Complete source: tracked files of the repo and its submodules, plus vcpkg's downloaded sources
          git ls-files --recurse-submodules -z > ../lsfiles.bin
          python -I - ../lsfiles.bin "$ST/src" <<'EOF'
          import os, shutil, sys
          dst = sys.argv[2]; n = links = 0
          for b in open(sys.argv[1], 'rb').read().split(b'\0'):
              if not b: continue
              p = b.decode('utf-8'); t = os.path.join(dst, p)
              os.makedirs(os.path.dirname(t), exist_ok=True)
              if os.path.islink(p): open(t, 'w', encoding='utf-8', newline='').write(os.readlink(p).replace(os.sep, '/')); links += 1
              elif os.path.isfile(p): shutil.copyfile(p, t)
              else: sys.exit('tracked file missing: ' + p)
              n += 1
          print(n, 'files,', links, 'symlinks written as text files holding their target')
          EOF
          mkdir -p "$ST/src/vcpkg-downloads"
          find ../vcpkg-downloads -maxdepth 1 -type f ! -name '*.part' -exec cp {} "$ST/src/vcpkg-downloads/" \; || true
          { echo "Source of Mojave in Skyrim ${VER} as built for the Mashup Library (GPL-3.0-or-later)."
            echo "${UPSTREAM}@${UPSTREAM_SHA}"; git submodule status --recursive
            echo "vcpkg: microsoft/vcpkg@ee12231b20c95013c6638d845d04c91559a1d1ff (builtin-baseline); vcpkg-downloads/ holds the"
            echo "source archives it fetched. Build: put vcpkg at ../.tools/vcpkg, cmake --preset default (x64 MSVC"
            echo "prompt), then either let CMake run tools/sheets.py gen (needs Skyrim SE and New Vegas installed) or"
            echo "replace that one command in build/**/*.ninja with a no-op to keep the committed src/generated/Sheets.h"
            echo "and package/MojaveInSkyrim.ini (as this build did), then cmake --build --preset release."
          } > "$ST/src/BUILD.txt"
          (cd "$ST/src" && 7z a -tzip -bso0 "../../out/${ID}-${VER}-source.zip" .)
          ls -la "$ST/src/vcpkg-downloads" | tee ../logs/3-vcpkg-downloads.txt
          mkdir -p ../logs/raw && cp build/RelWithDebInfo/MojaveInSkyrim.asi ../logs/raw/
          (cd "$OUT" && sha256sum -- * | sed 's/ \*/  /' > ../SHA256SUMS.txt) && mv ../SHA256SUMS.txt "$OUT/" && cat "$OUT/SHA256SUMS.txt"

      - name: Collect files, logs and status (always)
        if: always()
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p push && cp -r out/. push/ 2>/dev/null || true
          mkdir -p push/logs && cp -r logs/. push/logs/ 2>/dev/null || true
          {
            echo "upstream=${UPSTREAM}@${UPSTREAM_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "vcpkg=${{ steps.vcpkg.outcome }} native=${{ steps.native.outcome }} package=${{ steps.package.outcome }}"
          } > push/STATUS.txt

      - name: Upload them for the release job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-mojave-in-skyrim
          path: push/
          if-no-files-found: error
          retention-days: 3

  release:
    # Runs none of the creator's code (no checkout, nothing from the artifact is executed): checks the files, then
    # makes a DRAFT release. Publishing is done by hand after review.
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ID: mojave-in-skyrim
      VER: 0.2.0
      TAG: mojave-in-skyrim-v0.2.0
      TITLE: "Mojave in Skyrim"
      UPSTREAM: Pitorad/mojave-in-skyrim
      UPSTREAM_SHA: 58520efa9e7905421065ba866a7df4968dc36e43
      LICENCE: GPL-3.0-or-later
      GPL: 'yes'
      OWN_DLLS: ''
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-mojave-in-skyrim
          path: build

      - name: Check the files (SHA256SUMS, licence and notice, GPL source, no game files)
        shell: bash
        working-directory: build
        run: |
          set -euo pipefail
          cat STATUS.txt
          python3 -I - > ../check.log 2>&1 <<'EOF' || { cat ../check.log; exit 1; }
          import hashlib, os, re, sys, zipfile
          def sha(b): return hashlib.sha256(b).hexdigest()
          files = sorted(f for f in os.listdir('.') if os.path.isfile(f) and f != 'STATUS.txt')
          bad = []
          for n in ('SHA256SUMS.txt', 'LICENSE.txt', 'NOTICE.txt'):
              if n not in files: bad.append('missing ' + n)
          sums = {}
          for line in open('SHA256SUMS.txt', encoding='utf-8'):
              line = line.rstrip('\r\n')
              if line:
                  h, name = line.split('  ', 1); sums[name] = h
          present = set(files) - {'SHA256SUMS.txt'}
          if set(sums) != present: bad.append('SHA256SUMS.txt and the files differ: %s' % sorted(set(sums) ^ present))
          for name, h in sorted(sums.items()):
              ok = name in present and sha(open(name, 'rb').read()) == h
              print('%-8s %s %s' % ('ok' if ok else 'MISMATCH', h, name))
              if not ok: bad.append('hash mismatch: ' + name)
          if os.environ['GPL'] == 'yes' and not any(f.lower().endswith('source.zip') or 'source' in f.lower() for f in files):
              bad.append('GPL build without its source zip')
          # No game files: game data archives, Unity/game assemblies, Minecraft classes, and (when the build job listed them)
          # the compile-time reference assemblies, by name and by SHA-256.
          GAME_EXT = {'.wad', '.iwad', '.esm', '.esl', '.bsa', '.ba2', '.cpk', '.vpk', '.pak', '.utoc', '.ucas', '.uasset',
                      '.uexp', '.umap', '.bdt', '.bhd', '.dcx', '.gpk', '.forge', '.rpf'}
          GAME_DLL = re.compile(r'^(assembly-csharp.*|unityengine.*|unity\..*|mono\.cecil.*)\.dll$')
          forbidden_sha, forbidden_name = {}, set()
          if os.path.exists('logs/forbidden-assemblies.txt'):
              for line in open('logs/forbidden-assemblies.txt', encoding='utf-8'):
                  p = line.split()
                  if len(p) >= 2: forbidden_sha[p[0]] = p[1]; forbidden_name.add(p[1].lower())
              print('reference assemblies that must not ship: %d' % len(forbidden_sha))
          own = {n.lower() for n in os.environ.get('OWN_DLLS', '').split()}
          def check(container, name, data):
              base = name.replace('\\', '/').rsplit('/', 1)[-1].lower()
              where = container if container == name else container + ':' + name
              if os.path.splitext(base)[1] in GAME_EXT: bad.append('game data file: ' + where)
              if GAME_DLL.match(base): bad.append('game assembly: ' + where)
              if base in forbidden_name and base not in own: bad.append('reference assembly (by name): ' + where)
              if sha(data) in forbidden_sha: bad.append('reference assembly (by SHA-256): ' + where)
              if container.endswith('.jar') and container != name and re.match(r'(net/minecraft|com/mojang)/', name):
                  bad.append('Minecraft class: ' + where)
          n = 0
          for f in files:
              data = open(f, 'rb').read(); check(f, f, data); n += 1
              if f.lower().endswith(('.zip', '.jar')):
                  with zipfile.ZipFile(f) as z:
                      for i in z.infolist():
                          if i.is_dir(): continue
                          d = z.read(i); check(f, i.filename, d); n += 1
                          if i.filename.lower().endswith('.jar'):
                              import io
                              with zipfile.ZipFile(io.BytesIO(d)) as j:
                                  for k in j.infolist():
                                      if not k.is_dir(): check(i.filename, k.filename, j.read(k)); n += 1
          print('checked %d files and archive entries' % n)
          for b in bad: print('PROBLEM', b)
          sys.exit(1 if bad else 0)
          EOF
          cat ../check.log

      - name: Write the build log summary
        shell: bash
        working-directory: build
        run: |
          set -euo pipefail
          python3 -I - <<'EOF'
          import hashlib, os
          out = open('BUILD-LOG-SUMMARY.txt', 'w', encoding='utf-8', newline='\n')
          w = lambda s='': out.write(s + '\n')
          w('Build log summary: %s %s (%s)' % (os.environ['TITLE'], os.environ['VER'], os.environ['TAG']))
          w('Workflow run: %s' % os.environ['RUN_URL'])
          w('Workflow commit: %s' % os.environ['GITHUB_SHA'])
          w('This file is not listed in SHA256SUMS.txt: it is written after the build, from the build job\'s logs.')
          w()
          w('==== STATUS.txt ====')
          w(open('STATUS.txt', encoding='utf-8', errors='replace').read().rstrip())
          w()
          w('==== release checks ====')
          w(open('../check.log', encoding='utf-8', errors='replace').read().rstrip())
          logs = []
          for d, _, fs in os.walk('logs'):
              for f in fs: logs.append(os.path.join(d, f).replace('\\', '/'))
          for p in sorted(logs):
              size = os.path.getsize(p)
              if p.startswith('logs/raw/') or not p.endswith(('.log', '.txt', '.json')):
                  w(); w('==== %s (%d bytes, sha256 %s; binary copy kept for checking, not shown) ====' % (
                      p, size, hashlib.sha256(open(p, 'rb').read()).hexdigest()))
                  continue
              lines = open(p, encoding='utf-8', errors='replace').read().splitlines()
              w()
              if size <= 24000:
                  w('==== %s (%d bytes) ====' % (p, size)); [w(l) for l in lines]
              else:
                  w('==== %s (%d bytes, %d lines: first 40 and last 150 shown) ====' % (p, size, len(lines)))
                  [w(l) for l in lines[:40]]; w('[...]'); [w(l) for l in lines[-150:]]
          out.close()
          EOF
          wc -c BUILD-LOG-SUMMARY.txt

      - name: Make the DRAFT release mojave-in-skyrim-v0.2.0
        shell: bash
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A draft left by an earlier try of this workflow is replaced; a published release is never touched.
          gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv" > ../existing.tsv
          while IFS=$'\t' read -r RID DRAFT; do
            [ -n "$RID" ] || continue
            if [ "$DRAFT" = "true" ]; then gh api -X DELETE "repos/$GH_REPO/releases/$RID"; echo "deleted old draft $RID"
            else echo "$TAG is already published; not touching it"; exit 1; fi
          done < ../existing.tsv
          if git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"; exit 1
          fi
          {
            echo "**DRAFT, not published.** Unofficial community build for the Mashup Library."
            echo
            echo "Mojave in Skyrim 0.2.0 by Pitorad (a Skyrim SE/AE plugin that plays the player's own Fallout: New Vegas music), compiled unchanged from the pinned commit and submodules with the repo's CMake presets (MSVC, vcpkg at the manifest's baseline)."
            echo
            echo "- Source: https://github.com/${UPSTREAM}/tree/${UPSTREAM_SHA}"
            echo "- Licence: ${LICENCE} (LICENSE.txt; credits and third-party notices in NOTICE.txt)"
            [ "$GPL" = yes ] && echo "- Complete corresponding source: mojave-in-skyrim-0.2.0-source.zip (the repo and its submodules at the pinned commits, plus the source archives vcpkg downloaded)"
            echo "- Built by: ${RUN_URL} (workflow \`.github/workflows/build-${ID}.yml\` at ${GITHUB_SHA})"
            echo "- Details: https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/docs/${ID}/README.md"
            echo "- No game files are included."
            echo
            echo "SHA-256 (SHA256SUMS.txt):"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md
          FILES=(); for f in *; do if [ -f "$f" ] && [ "$f" != STATUS.txt ]; then FILES+=("$f"); fi; done
          printf '%s\n' "${FILES[@]}"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE $VER" --notes-file ../notes.md "${FILES[@]}"
          gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .html_url, (.assets[] | \"\(.name) \(.size)\")"

  failure-log:
    # Only when the build fails: keeps the build's logs (the artifact's logs/ and, when GitHub serves it, the job log)
    # as a DRAFT release `debug-<id>-<run>` so they can be read without the Actions log viewer (delete those drafts
    # once read). Runs none of the creator's code.
    needs: build
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-mojave-in-skyrim
          path: build

      - name: Save the failed build's logs as a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          FILES=()
          if [ -d build ]; then (cd build && zip -qr ../build-logs.zip STATUS.txt logs) && FILES+=(build-logs.zip); fi
          JID=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "build") | .id')
          for i in $(seq 1 12); do
            if gh api "repos/$GH_REPO/actions/jobs/$JID/logs" > build-job-log.txt 2> err.txt && [ -s build-job-log.txt ]; then
              FILES+=(build-job-log.txt); tail -n 80 build-job-log.txt; break
            fi
            cat err.txt; sleep 15
          done
          [ ${#FILES[@]} -gt 0 ] || { echo "no logs to save"; exit 1; }
          gh release create "debug-mojave-in-skyrim-$RUN_ID" --draft --target "$GITHUB_SHA" --title "debug log mojave-in-skyrim $RUN_ID (delete me)" \
            --notes "Logs of a failed build, kept for reading. Not a release." "${FILES[@]}"
