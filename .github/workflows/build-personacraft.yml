# BUILD: PersonaCraft 0.1.0 -> DRAFT release personacraft-v0.1.0 of this repo.
# PersonaCraft by llmandres (Persona 5 Royal + Minecraft 26.3, MIT; its link is SkyCraft's, MIT, chasmlol), built
# unchanged at a pinned commit with the creator's command (dotnet build -c Release, .NET SDK 9).
# No game files: the mod compiles against NuGet packages only (Reloaded-II's and p5rpc.lib's interface packages,
# CriFsV2Lib, Vortice). Persona 5 Royal's data is read at run time from the player's own BASE.CPK.
#
# Two jobs: `build` runs the creator's build on a Windows runner with a read-only token and uploads the files
# as an artifact; `release` runs none of that code: it checks SHA256SUMS.txt, LICENSE/NOTICE, the GPL source
# and that no game file is in any file or archive, then makes a DRAFT release (published by hand after review).
# Started by hand: gh api -X POST repos/yousufkiani99/mashup-builds/actions/workflows/build-personacraft.yml/dispatches
# -f ref=<branch>. The push trigger only registers the workflow; on a push both jobs are skipped.
name: Build - PersonaCraft

on:
  push:
    branches: ['builds/wave2']
    paths: ['.github/workflows/build-personacraft.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      ID: personacraft
      VER: 0.1.0
      UPSTREAM: llmandres/PersonaCraft
      UPSTREAM_SHA: 3f00c03ae7b10785ca467fba31079bc3b870f80a
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llmandres/PersonaCraft
          ref: 3f00c03ae7b10785ca467fba31079bc3b870f80a
          path: upstream
          persist-credentials: false

      - name: Logs folder
        shell: bash
        working-directory: .
        run: |
          mkdir -p logs out
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"   # the pinned commit, nothing else
          git -C upstream log -1 --format='upstream %H %ci %s' | tee logs/0-upstream.txt

      # For the recipe only (not part of the build): Steam's public build of Persona 5 Royal (app 1687950).
      - name: Look up Persona 5 Royal on Steam (app 1687950)
        continue-on-error: true
        shell: bash
        working-directory: .
        run: curl -fsSL --retry 3 "https://api.steamcmd.net/v1/info/1687950?pretty=1" > logs/0-steam-1687950.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build the Reloaded-II mod (dotnet build -c Release)
        id: dotnet
        shell: bash
        run: |
          set -o pipefail
          dotnet --info > ../logs/1-dotnet-info.log 2>&1 || true
          # The csproj builds straight into Reloaded-II's Mods folder; -p:ReloadedModsDir points it at ours.
          dotnet build p5rpc.personacraft -c Release "-p:ReloadedModsDir=$(cygpath -w "$PWD/../modsdir")" 2>&1 | tee ../logs/1-dotnet-build.log
          test -f ../modsdir/p5rpc.personacraft/p5rpc.personacraft.dll
          test -f ../modsdir/p5rpc.personacraft/ModConfig.json

      - name: Record NuGet package licences and hashes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          NUGET="$USERPROFILE/.nuget/packages"
          {
            for p in reloaded.mod.interfaces/2.4.0 reloaded.sharedlib.hooks/1.9.0 reloaded.memory.sigscan.reloadedii.interfaces/1.2.0 \
                     p5rpc.lib.interfaces/1.1.0 p5rpc.inputhook.interfaces/1.0.0 crifsv2lib/2.1.2 vortice.direct3d11/3.8.1 \
                     vortice.d3dcompiler/3.8.1; do
              d="$NUGET/$p"; n=${p%/*}
              echo "== $p"
              sha256sum "$d"/*.nupkg 2>/dev/null || true
              grep -o -E '<license[^<]*</license>|<licenseUrl>[^<]*</licenseUrl>|<projectUrl>[^<]*</projectUrl>|<repository [^>]*>' "$d/$n.nuspec" || true
            done
            echo "== everything restored (project.assets.json)"
            grep -o -E '"[A-Za-z0-9.]+/[0-9][^"]*": \{' p5rpc.personacraft/obj/project.assets.json | sort -u
          } > ../logs/2-nuget-licences.log 2>&1
          cat ../logs/2-nuget-licences.log

      - name: Source of the LGPL libraries the mod folder ships (CriFsV2Lib, p5rpc interfaces)
        id: lgpl
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          # CriFsV2Lib(.Definitions), p5rpc.lib.interfaces and p5rpc.inputhook.interfaces are LGPL-3.0-or-later (their
          # NuGet licence, see logs/2-nuget-licences.log) and their DLLs are in the mod folder, so their source goes
          # next to the build: each library project at the tag whose csproj has the shipped version.
          L=stage-lgpl/personacraft-0.1.0-lgpl-sources; rm -rf stage-lgpl _lgpl; mkdir -p "$L" _lgpl
          while read -r REPO TAG SHA PATHS WHAT; do
            [ -n "$REPO" ] || continue
            D="_lgpl/${REPO#*/}"
            git clone -q --depth 1 --branch "$TAG" "https://github.com/$REPO.git" "$D"
            test "$(git -C "$D" rev-parse HEAD)" = "$SHA"
            git -C "$D" archive --format=tar --prefix="${REPO#*/}-$TAG/" HEAD -- ${PATHS//,/ } | tar -x -C "$L"
            echo "$REPO tag $TAG = $SHA: ${PATHS} -> ${WHAT}" | tee -a logs/2-lgpl-sources.log
          done <<'EOF'
          Sewer56/CriFsV2Lib 2.1.2 9bf3b9c94015275db8d4f89be99454a4cd92d398 CriFsV2Lib,CriFsV2Lib.Definitions,README.md,global.json CriFsV2Lib.dll 2.1.2 and CriFsV2Lib.Definitions.dll 1.1.0
          AnimatedSwine37/p5rpc.lib 1.1.0 6cb4bda9eee2bfd5334617a1fdd2386319d74ffb p5rpc.lib.interfaces,LICENSE,README.md p5rpc.lib.interfaces.dll 1.1.0
          AnimatedSwine37/p5rpc.inputhook 1.0 ad78e4d0d193a9a4af3b198f71fdb18a09c8b187 p5rpc.inputhook.interfaces,README.md p5rpc.inputhook.interfaces.dll 1.0.0
          EOF
          SPDX=https://raw.githubusercontent.com/spdx/license-list-data/v3.27.0/text
          curl -fsSL --retry 3 -o "$L/LGPL-3.0.txt" "$SPDX/LGPL-3.0-or-later.txt"
          curl -fsSL --retry 3 -o "$L/GPL-3.0.txt" "$SPDX/GPL-3.0-or-later.txt"
          printf '%s  %s\n' 996af0513df21f7496288951c41428a03c174e9e4a9d63665c57d670f845ccb1 "$L/LGPL-3.0.txt" \
            fb981668c18a279e285fc4d83fba1e836cc84dd4daa73c9697d3cfd2d8aca6e0 "$L/GPL-3.0.txt" | sha256sum -c -
          {
            echo "Source of the LGPL-3.0-or-later libraries shipped, unmodified, in PersonaCraft ${VER}'s mod folder"
            echo "(as restored from NuGet by the build; see SHA256SUMS of the packages in the build log summary)."
            echo
            cat logs/2-lgpl-sources.log
            echo
            echo "Each folder is the library's project at that tag (git archive). Licence texts: LGPL-3.0.txt, GPL-3.0.txt."
            echo "PersonaCraft itself is MIT; it uses these libraries as separate DLLs that can be replaced."
          } > "$L/README.txt"
          cp "$L/LGPL-3.0.txt" "$L/GPL-3.0.txt" out/
          (cd stage-lgpl && 7z a -tzip -bso0 "../out/${ID}-${VER}-lgpl-sources.zip" personacraft-0.1.0-lgpl-sources)

      - name: Package the release files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          OUT=../out; MOD=../modsdir/p5rpc.personacraft
          ls -la "$MOD" | tee ../logs/3-mod-folder.log
          cp LICENSE "$OUT/LICENSE.txt"
          {
            echo "PersonaCraft ${VER} - unofficial community build"
            echo
            echo "What this is: a ready-made build of PersonaCraft by llmandres, https://github.com/${UPSTREAM},"
            echo "compiled unchanged from commit ${UPSTREAM_SHA} by GitHub Actions (windows-latest, .NET SDK 9,"
            echo "dotnet build -c Release). It is NOT an official release: it is a community build made for the Mashup"
            echo "Library app under the project's MIT licence (LICENSE.txt). Report problems with this build to the"
            echo "Mashup Library, not to llmandres."
            echo
            echo "Experimental, single player. Made for Persona 5 Royal on Steam with Reloaded-II and the Reloaded mods"
            echo "p5rpc.lib, p5rpc.inputhook, reloaded.sharedlib.hooks and Reloaded.Memory.SigScan.ReloadedII (installed"
            echo "separately). The Minecraft side is SkyCraft's own Fabric mod (link protocol 11, SkyCraft 0.1.2)."
            echo
            echo "Credits: llmandres (PersonaCraft); chasmlol (SkyCraft, MIT: the shared-memory protocol and link code);"
            echo "PeakCraft; AnimatedSwine37 (p5rpc.lib, p5rpc.inputhook); rirurin (p5r-freecam, opengfd: a function"
            echo "signature and the camera layout); TGE (GFD-Studio: the GFS format); Sewer56 (Reloaded-II, CriFsV2Lib)."
            echo
            echo "NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT."
            echo "Not affiliated with Atlus or SEGA. No game files are included."
            echo
            echo "---- Files ----"
            echo "${ID}-${VER}-reloaded-mod.zip unpacks into Reloaded-II's Mods folder as p5rpc.personacraft\\"
            echo "(ModConfig.json, p5rpc.personacraft.dll, PersonaCraft.Core.dll and the NuGet libraries it ships)."
            echo
            echo "---- NuGet libraries in the mod folder (each under its own licence; see the package pages) ----"
            ls "$MOD" | grep -i '\.dll$' | sed 's/^/  /'
            echo
            echo "---- LGPL libraries ----"
            echo "CriFsV2Lib.dll, CriFsV2Lib.Definitions.dll (Sewer56), p5rpc.lib.interfaces.dll and"
            echo "p5rpc.inputhook.interfaces.dll (AnimatedSwine37) are LGPL-3.0-or-later, shipped unmodified as separate"
            echo "DLLs. Their source: ${ID}-${VER}-lgpl-sources.zip, published next to this build. Licence texts:"
            echo "LGPL-3.0.txt and GPL-3.0.txt. Vortice.* and SharpGen.Runtime*: MIT."
            echo
            echo "---- Package licences as recorded at build time ----"
            cat ../logs/2-nuget-licences.log 2>/dev/null || true
          } > "$OUT/NOTICE.txt"
          cp "$OUT/LICENSE.txt" "$OUT/NOTICE.txt" "$OUT/LGPL-3.0.txt" "$OUT/GPL-3.0.txt" "$MOD/"
          (cd ../modsdir && 7z a -tzip -bso0 "../out/${ID}-${VER}-reloaded-mod.zip" p5rpc.personacraft)
          (cd "$OUT" && sha256sum -- * | sed 's/ \*/  /' > ../SHA256SUMS.txt) && mv ../SHA256SUMS.txt "$OUT/" && cat "$OUT/SHA256SUMS.txt"

      - name: Collect files, logs and status (always)
        if: always()
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p push && cp -r out/. push/ 2>/dev/null || true
          mkdir -p push/logs && cp -r logs/. push/logs/ 2>/dev/null || true
          {
            echo "upstream=${UPSTREAM}@${UPSTREAM_SHA}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "dotnet=${{ steps.dotnet.outcome }} lgpl=${{ steps.lgpl.outcome }} package=${{ steps.package.outcome }}"
          } > push/STATUS.txt

      - name: Upload them for the release job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-personacraft
          path: push/
          if-no-files-found: error
          retention-days: 3

  release:
    # Runs none of the creator's code (no checkout, nothing from the artifact is executed): checks the files, then
    # makes a DRAFT release. Publishing is done by hand after review.
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ID: personacraft
      VER: 0.1.0
      TAG: personacraft-v0.1.0
      TITLE: "PersonaCraft"
      UPSTREAM: llmandres/PersonaCraft
      UPSTREAM_SHA: 3f00c03ae7b10785ca467fba31079bc3b870f80a
      LICENCE: MIT
      GPL: 'no'
      OWN_DLLS: ''
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-personacraft
          path: build

      - name: Check the files (SHA256SUMS, licence and notice, GPL source, no game files)
        shell: bash
        working-directory: build
        run: |
          set -euo pipefail
          cat STATUS.txt
          python3 -I - > ../check.log 2>&1 <<'EOF' || { cat ../check.log; exit 1; }
          import hashlib, os, re, sys, zipfile
          def sha(b): return hashlib.sha256(b).hexdigest()
          files = sorted(f for f in os.listdir('.') if os.path.isfile(f) and f != 'STATUS.txt')
          bad = []
          for n in ('SHA256SUMS.txt', 'LICENSE.txt', 'NOTICE.txt'):
              if n not in files: bad.append('missing ' + n)
          sums = {}
          for line in open('SHA256SUMS.txt', encoding='utf-8'):
              line = line.rstrip('\r\n')
              if line:
                  h, name = line.split('  ', 1); sums[name] = h
          present = set(files) - {'SHA256SUMS.txt'}
          if set(sums) != present: bad.append('SHA256SUMS.txt and the files differ: %s' % sorted(set(sums) ^ present))
          for name, h in sorted(sums.items()):
              ok = name in present and sha(open(name, 'rb').read()) == h
              print('%-8s %s %s' % ('ok' if ok else 'MISMATCH', h, name))
              if not ok: bad.append('hash mismatch: ' + name)
          if os.environ['GPL'] == 'yes' and not any(f.lower().endswith('source.zip') or 'source' in f.lower() for f in files):
              bad.append('GPL build without its source zip')
          # No game files: game data archives, Unity/game assemblies, Minecraft classes, and (when the build job listed them)
          # the compile-time reference assemblies, by name and by SHA-256.
          GAME_EXT = {'.wad', '.iwad', '.esm', '.esl', '.bsa', '.ba2', '.cpk', '.vpk', '.pak', '.utoc', '.ucas', '.uasset',
                      '.uexp', '.umap', '.bdt', '.bhd', '.dcx', '.gpk', '.forge', '.rpf'}
          GAME_DLL = re.compile(r'^(assembly-csharp.*|unityengine.*|unity\..*|mono\.cecil.*)\.dll$')
          forbidden_sha, forbidden_name = {}, set()
          if os.path.exists('logs/forbidden-assemblies.txt'):
              for line in open('logs/forbidden-assemblies.txt', encoding='utf-8'):
                  p = line.split()
                  if len(p) >= 2: forbidden_sha[p[0]] = p[1]; forbidden_name.add(p[1].lower())
              print('reference assemblies that must not ship: %d' % len(forbidden_sha))
          own = {n.lower() for n in os.environ.get('OWN_DLLS', '').split()}
          def check(container, name, data):
              base = name.replace('\\', '/').rsplit('/', 1)[-1].lower()
              where = container if container == name else container + ':' + name
              if os.path.splitext(base)[1] in GAME_EXT: bad.append('game data file: ' + where)
              if GAME_DLL.match(base): bad.append('game assembly: ' + where)
              if base in forbidden_name and base not in own: bad.append('reference assembly (by name): ' + where)
              if sha(data) in forbidden_sha: bad.append('reference assembly (by SHA-256): ' + where)
              if container.endswith('.jar') and container != name and re.match(r'(net/minecraft|com/mojang)/', name):
                  bad.append('Minecraft class: ' + where)
          n = 0
          for f in files:
              data = open(f, 'rb').read(); check(f, f, data); n += 1
              if f.lower().endswith(('.zip', '.jar')):
                  with zipfile.ZipFile(f) as z:
                      for i in z.infolist():
                          if i.is_dir(): continue
                          d = z.read(i); check(f, i.filename, d); n += 1
                          if i.filename.lower().endswith('.jar'):
                              import io
                              with zipfile.ZipFile(io.BytesIO(d)) as j:
                                  for k in j.infolist():
                                      if not k.is_dir(): check(i.filename, k.filename, j.read(k)); n += 1
          print('checked %d files and archive entries' % n)
          for b in bad: print('PROBLEM', b)
          sys.exit(1 if bad else 0)
          EOF
          cat ../check.log

      - name: Write the build log summary
        shell: bash
        working-directory: build
        run: |
          set -euo pipefail
          python3 -I - <<'EOF'
          import hashlib, os
          out = open('BUILD-LOG-SUMMARY.txt', 'w', encoding='utf-8', newline='\n')
          w = lambda s='': out.write(s + '\n')
          w('Build log summary: %s %s (%s)' % (os.environ['TITLE'], os.environ['VER'], os.environ['TAG']))
          w('Workflow run: %s' % os.environ['RUN_URL'])
          w('Workflow commit: %s' % os.environ['GITHUB_SHA'])
          w('This file is not listed in SHA256SUMS.txt: it is written after the build, from the build job\'s logs.')
          w()
          w('==== STATUS.txt ====')
          w(open('STATUS.txt', encoding='utf-8', errors='replace').read().rstrip())
          w()
          w('==== release checks ====')
          w(open('../check.log', encoding='utf-8', errors='replace').read().rstrip())
          logs = []
          for d, _, fs in os.walk('logs'):
              for f in fs: logs.append(os.path.join(d, f).replace('\\', '/'))
          for p in sorted(logs):
              size = os.path.getsize(p)
              if p.startswith('logs/raw/') or not p.endswith(('.log', '.txt', '.json')):
                  w(); w('==== %s (%d bytes, sha256 %s; binary copy kept for checking, not shown) ====' % (
                      p, size, hashlib.sha256(open(p, 'rb').read()).hexdigest()))
                  continue
              lines = open(p, encoding='utf-8', errors='replace').read().splitlines()
              w()
              if size <= 24000:
                  w('==== %s (%d bytes) ====' % (p, size)); [w(l) for l in lines]
              else:
                  w('==== %s (%d bytes, %d lines: first 40 and last 150 shown) ====' % (p, size, len(lines)))
                  [w(l) for l in lines[:40]]; w('[...]'); [w(l) for l in lines[-150:]]
          out.close()
          EOF
          wc -c BUILD-LOG-SUMMARY.txt

      - name: Make the DRAFT release personacraft-v0.1.0
        shell: bash
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A draft left by an earlier try of this workflow is replaced; a published release is never touched.
          gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv" > ../existing.tsv
          while IFS=$'\t' read -r RID DRAFT; do
            [ -n "$RID" ] || continue
            if [ "$DRAFT" = "true" ]; then gh api -X DELETE "repos/$GH_REPO/releases/$RID"; echo "deleted old draft $RID"
            else echo "$TAG is already published; not touching it"; exit 1; fi
          done < ../existing.tsv
          if git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"; exit 1
          fi
          {
            echo "**DRAFT, not published.** Unofficial community build for the Mashup Library."
            echo
            echo "PersonaCraft 0.1.0 by llmandres (Persona 5 Royal + Minecraft 26.3; link code from chasmlol's SkyCraft), compiled unchanged from the pinned commit with \`dotnet build -c Release\` (.NET SDK 9). The Reloaded-II mod only; the Minecraft side is SkyCraft's own jar."
            echo
            echo "- Source: https://github.com/${UPSTREAM}/tree/${UPSTREAM_SHA}"
            echo "- Licence: ${LICENCE} (LICENSE.txt; credits and third-party notices in NOTICE.txt)"
            [ "$GPL" = yes ] && echo "- Complete corresponding source: "
            echo "- Built by: ${RUN_URL} (workflow \`.github/workflows/build-${ID}.yml\` at ${GITHUB_SHA})"
            echo "- Details: https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/docs/${ID}/README.md"
            echo "- No game files are included."
            echo
            echo "SHA-256 (SHA256SUMS.txt):"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md
          FILES=(); for f in *; do if [ -f "$f" ] && [ "$f" != STATUS.txt ]; then FILES+=("$f"); fi; done
          printf '%s\n' "${FILES[@]}"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE $VER" --notes-file ../notes.md "${FILES[@]}"
          gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | .html_url, (.assets[] | \"\(.name) \(.size)\")"

  failure-log:
    # Only when the build fails: keeps the build job's log as a DRAFT release `debug-<id>-<run>` so it can be read
    # without the Actions log viewer (delete those drafts once read). Runs none of the creator's code.
    needs: build
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Save the failed build's log as a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          JID=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "build") | .id')
          for i in 1 2 3 4 5 6; do gh api "repos/$GH_REPO/actions/jobs/$JID/logs" > build-job-log.txt && [ -s build-job-log.txt ] && break; sleep 10; done
          tail -n 60 build-job-log.txt
          gh release create "debug-personacraft-$RUN_ID" --draft --target "$GITHUB_SHA" --title "debug log personacraft $RUN_ID (delete me)" \
            --notes "Log of a failed build job, kept for reading. Not a release." build-job-log.txt
